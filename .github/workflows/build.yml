name: build

on:
  push:
    branches: [clipping]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Vetva clipping = verzia pre mobil Chat Diff / Clutch Diff (len tieto dva kanaly). Vlastny tag a vydanie,
      # vydanie 'latest' z vetvy main sa nemeni.
      - name: Move 'clip-latest' tag
        run: |
          git tag -f clip-latest
          git push -f origin clip-latest

      - name: Publish release 'clip-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: clip-latest
          name: TikTok Nahrávač (Chat Diff + Clutch Diff)
          body: Build z vetvy clipping, len kanály Chat Diff a Clutch Diff. Pre mobil vyčlenený na klipy.
          make_latest: "false"
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: false
